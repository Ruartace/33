# 宝塔面板站点：47.108.144.113:9997
# 用途：静态站点根目录 dist，SPA history 路由回退到 index.html；
#       /api 反向代理到真实后端 http://117.72.195.83:7841
#
# 关键点：
#   1. 用 location ^~ /api/ 而不是 location /api/
#      本 vhost 里存在正则 location（如 ~ .*\.(js|css)?$），nginx 的匹配顺序是
#      「精确 =」 > 「最长前缀 ^~ / 前缀」 > 「正则（按出现顺序）」 > 「普通前缀」。
#      普通前缀 /api/ 仍可能被后面的正则 location 抢先匹配，所以必须加 ^~ 让正则全部失效。
#   2. proxy_pass 末尾保留 /api/，后端路由本身就带 /api 前缀，
#      /api/user/options -> http://117.72.195.83:7841/api/user/options
#   3. 上传接口传 ZIP/大文件，必须放开 client_max_body_size（nginx 默认 1m 会直接 413）
#   4. 解析/导出接口耗时长，放宽 proxy_read_timeout
#   5. Host 头写成后端真实地址，避免后端按域名做校验时被拒

server
{
    listen 9997;
    server_name 47.108.144.113_9997;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/laiwenqianduan/dist;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/47.108.144.113_9997.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/47.108.144.113_9997/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/47.108.144.113_9997.conf;
    #REWRITE-END

    # ===== 接口反向代理：前端只请求同源 /api，避免跨域 =====
    location ^~ /api/
    {
        proxy_pass http://117.72.195.83:7841/api/;
        proxy_http_version 1.1;
        proxy_set_header Host 117.72.195.83:7841;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 200m;
    }

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/47.108.144.113_9997.log;
    error_log  /www/wwwlogs/47.108.144.113_9997.error.log;
}
